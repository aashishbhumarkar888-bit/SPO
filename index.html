    <script>
      (function() {
        try {
          var saved = localStorage.getItem('agriseva_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#F4F7F5] dark:bg-[#071711] text-[#063B2A] dark:text-[#F0FAF5] antialiased selection:bg-[#168A5B] selection:text-white font-['Plus_Jakarta_Sans','Noto_Sans_Devanagari',sans-serif]">

    <script type="module" src="/src/main.tsx"></script>
  </body>
